[plugin_runtime]
enabled = true
auto_start = false

[sfs_bridge]
# SFS-Agent 模组在游戏内监听的地址
bridge_url = "http://127.0.0.1:21578"
# 单次请求超时（秒）
timeout_seconds = 12
# 截图超时（秒），游戏内截图需要等一帧
screenshot_timeout_seconds = 20
# 发送给视觉模型前，画面的最大宽度（像素）
screenshot_max_width = 1024
# JPEG 压缩质量
screenshot_jpeg_quality = 80
# 是否把画面交给 N.E.K.O. 的视觉聊天模型识别
vision_enabled = true
# 视觉提示词：告诉模型这张图是什么、要看什么
vision_prompt = "这是航天模拟器 Spaceflight Simulator 的当前游戏画面。请描述你看到的火箭结构、飞行阶段与环境，并结合用户的提问回答。"

[vlm_fallback]
# 默认关闭：画面由 N.E.K.O. 的「视觉聊天模型」识别
# （设置 → API → 视觉聊天模型）
# 若该会话没有配置视觉模型，可启用下面这项，让插件自己调用一个
# OpenAI 兼容的视觉接口把画面转成文字。
enabled = false
base_url = ""
api_key = ""
model = ""
max_tokens = 600
