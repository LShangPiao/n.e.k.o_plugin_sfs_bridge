[plugin_runtime]
enabled = true
auto_start = false

[sfs_bridge]
# SFS-Agent 模组在游戏内监听的地址
bridge_url = "http://127.0.0.1:21578"
# 单次请求超时（秒）
timeout_seconds = 12
# 点击后等多久再回读界面（秒），范围 0.5-30
post_click_wait_seconds = 3.0
# 截图超时（秒），游戏内截图需要等一帧
screenshot_timeout_seconds = 20
# 发送给视觉模型前，画面的最大宽度（像素）
screenshot_max_width = 1024
# JPEG 压缩质量
screenshot_jpeg_quality = 80
# 是否把画面交给 N.E.K.O. 的视觉聊天模型识别
vision_enabled = true
# 视觉提示词：告诉模型这张图是什么、要看什么
vision_prompt = "这是航天模拟器 Spaceflight Simulator 的当前游戏画面。请描述你看到的火箭结构、飞行阶段与环境，并结合用户的提问回答。"

# ── 自动播报 ──────────────────────────────────────────────────────
# 开启后，只要游戏在跑，插件就会在后台自己读遥测，把最新的火箭状况
# 塞进角色的上下文里。它用的是「只读不打断」的方式：不会突然插话，
# 但主人下次开口时，角色已经知道你现在飞在哪儿、多高、多快。
# 关掉就退回旧的问答式行为：你问了才去读。
auto_brief_enabled = true
# 自动播报的轮询间隔（秒），范围 5-300。
# 队列里同一时刻只保留最新一条（coalesce），所以调小不会把上下文撑爆，
# 只是更费一点本机 CPU。起飞和入轨阶段参数变化快，间隔别设太大。
auto_brief_interval_seconds = 20

[vlm_fallback]
# 默认关闭：画面由 N.E.K.O. 的「视觉聊天模型」识别
# （设置 → API → 视觉聊天模型）
# 若该会话没有配置视觉模型，可启用下面这项，让插件自己调用一个
# OpenAI 兼容的视觉接口把画面转成文字。
enabled = false
base_url = ""
api_key = ""
model = ""
max_tokens = 600
